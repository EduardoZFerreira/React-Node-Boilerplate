server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback: React Router handles routes like /app/items client-side,
    # so a direct hit or refresh on a deep URL must still serve index.html
    # instead of a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints build assets (e.g. index-abc123.js), so they're safe
    # to cache aggressively — a new deploy just gets new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
